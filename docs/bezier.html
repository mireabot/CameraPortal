  #portal-bezier {
    --gray-1: #fcfcfc;
    --gray-4: #e8e8e8;
    --gray-7: #cecece;
    --gray-8: #bbbbbb;
    --gray-11: #646464;
    --gray-12: #202020;
    --pink-9: #d6409f;
    --bg: var(--gray-1);
    --fg: var(--gray-12);
    --border: var(--gray-4);
    --radius-base: 8px;
    display: block;
    position: relative;
    box-sizing: border-box;
    width: 200px;
    height: 200px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    border: 0;
    border-radius: var(--radius-base);
    box-shadow: inset 0 0 0 1px var(--border);
    background: var(--bg);
    color: var(--fg);
    font-family: "Portal Open Sauce Two", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
    text-align: left;
    -webkit-font-smoothing: antialiased;
  }
  #portal-bezier .bezier-plot { display: block; overflow: visible; font: inherit; }
  #portal-bezier .heading { fill: var(--fg); }
  #portal-bezier .grid { fill: none; stroke: var(--gray-4); stroke-width: 1; }
  #portal-bezier .axis { fill: none; stroke: var(--gray-7); stroke-width: 1; }
  #portal-bezier .handles { fill: none; stroke: var(--gray-8); stroke-width: 1; stroke-dasharray: 2 3; }
  #portal-bezier .handle { fill: var(--bg); stroke: var(--gray-8); stroke-width: 1; }
  #portal-bezier .curve { fill: none; stroke: var(--fg); stroke-width: 1.5; stroke-linecap: round; }
  #portal-bezier .axis-label { fill: var(--gray-11); }
  #portal-bezier .ball { position: absolute; left: 31px; top: 143px; width: 10px; height: 10px; border-radius: 50%; background: var(--pink-9); transform: translate(0px, 0px); }
  #portal-bezier .speed { position: absolute; bottom: 10px; left: 16px; color: var(--gray-11); }
  #portal-bezier .replay { position: absolute; bottom: 10px; right: 16px; color: var(--fg); }
  #portal-bezier:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    #portal-bezier {
      --gray-1: #111111;
      --gray-4: #2a2a2a;
      --gray-7: #484848;
      --gray-8: #606060;
      --gray-11: #b4b4b4;
      --gray-12: #eeeeee;
    }
  }
</style>
<script>
(() => {
  const root = document.getElementById('portal-bezier');
  const ball = root.querySelector('.ball');
  const label = root.querySelector('.replay');
  const speed = root.querySelector('.speed');
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  let animation;
  let generation = 0;

  function coordinate(t, p1, p2) {
    const remaining = 1 - t;
    return 3 * remaining * remaining * t * p1 + 3 * remaining * t * t * p2 + t * t * t;
  }

  function progressAt(time) {
    if (time === 0 || time === 1) return time;
    let low = 0, high = 1;
    for (let i = 0; i < 28; i++) {
      const t = (low + high) / 2;
      if (coordinate(t, .77, .175) < time) low = t;
      else high = t;
    }
    return coordinate((low + high) / 2, 0, 1);
  }

  const frames = Array.from({ length: 241 }, (_, i) => {
    const time = i / 240;
    return { offset: time, transform: `translate(${140 * time}px, ${-104 * progressAt(time)}px)` };
  });

  function play() {
    const current = ++generation;
    animation?.cancel();
    if (reducedMotion.matches) {
      ball.style.transform = 'translate(140px, -104px)';
      speed.textContent = 'Reduced motion';
      animation = ball.animate([{ opacity: .25 }, { opacity: 1 }], { duration: 160, fill: 'forwards' });
    } else {
      ball.style.transform = 'translate(0px, 0px)';
      speed.textContent = '6× slower';
      animation = ball.animate(frames, { duration: 1800, easing: 'linear', fill: 'forwards' });
    }
    label.textContent = 'Playing';
    animation.finished.then(() => {
      if (generation === current) label.textContent = 'Replay';
    }).catch(() => {});
  }

  root.addEventListener('click', play);
  reducedMotion.addEventListener('change', () => {
    ++generation;
    animation?.cancel();
    ball.style.transform = reducedMotion.matches ? 'translate(140px, -104px)' : 'translate(0px, 0px)';
    speed.textContent = reducedMotion.matches ? 'Reduced motion' : '6× slower';
    label.textContent = 'Replay';
  });
  if (reducedMotion.matches) {
    ball.style.transform = 'translate(140px, -104px)';
    speed.textContent = 'Reduced motion';
  } else {
    const observer = new IntersectionObserver(entries => {
      if (entries.some(entry => entry.isIntersecting)) {
        observer.disconnect();
        play();
      }
    });
    observer.observe(root);
  }
})();
</script>
